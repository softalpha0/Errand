# Render blueprint for the agent. The web app goes on Vercel (see docs/deploy.md).
services:
  - type: web
    name: errand-agent
    runtime: docker
    dockerfilePath: ./apps/agent/Dockerfile
    dockerContext: .
    region: frankfurt # next to the Neon database
    # Free plan: sleeps after 15 idle minutes. Keep it awake with a free pinger hitting /health every 10 minutes (docs/deploy.md).
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # On a paid plan, add a disk so connected people's Kite logins survive restarts:
    # disk: { name: errand-data, mountPath: /data, sizeGB: 1 }
    envVars:
      - key: ERRAND_MODE
        value: demo
      - key: WEB_ORIGIN
        sync: false
      - key: SERV_API_KEY
        sync: false
      - key: SERV_GUARD_GRAPH_ID
        sync: false
      - key: SERV_GUARD_VERSION
        sync: false
      - key: REPPO_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ERRAND_ACCESS_CODE
        sync: false
      - key: MAX_BUDGET_USD
        value: "10"
      - key: DEFAULT_COUNTRY
        value: NG
      - key: DOLPHIN_API_KEY
        sync: false
      - key: GUARD_SERVICE_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      # Connected people's Kite logins. On the free plan this folder is wiped on restart.
      - key: PASSPORTS_DIR
        value: /tmp/passports

  # The paid guard service other Kite Passport agents call (x402 on the Kite chain, built on kite-x402-hono / Bun).
  - type: web
    name: errand-guard
    runtime: docker
    dockerfilePath: ./kite-service/errand-guard/Dockerfile
    dockerContext: ./kite-service/errand-guard
    region: frankfurt
    plan: free # sleeps when idle; a caller waits for it to wake
    healthCheckPath: /healthz
    envVars:
      - key: PAY_TO
        sync: false
      - key: KITE_NETWORK
        value: testnet
      - key: UPSTREAM_URL
        sync: false
      - key: UPSTREAM_AUTH_HEADER
        value: x-guard-token
      - key: UPSTREAM_AUTH_VALUE
        sync: false
      - key: PRICE_USD
        value: "0.01"
