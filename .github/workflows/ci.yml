name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit tests only: nothing in CI spends money or calls SERV, Kite or Reppo.
      - run: pnpm test
      - run: pnpm --filter @errand/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Errand Guard (Kite x402 service on kite-x402-hono) typecheck
        working-directory: kite-service/errand-guard
        run: bun install --frozen-lockfile && bun run typecheck
